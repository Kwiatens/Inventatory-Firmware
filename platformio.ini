; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_esp32s3_nano_usb

[env:waveshare_esp32s3_nano_common]
platform = espressif32@7.0.1
board = waveshare_esp32s3_nano
framework = arduino
monitor_speed = 115200

lib_deps =
  olikraus/U8g2@2.35.30
  throwtheswitch/Unity@2.6.1
build_flags = -std=gnu++17
board_build.partitions = partitions.csv

[env:waveshare_esp32s3_nano]
extends = env:waveshare_esp32s3_nano_common
upload_protocol = esptool

[env:waveshare_esp32s3_nano_ota]
extends = env:waveshare_esp32s3_nano_common
; The hostname must match DEVICE_ID / ArduinoOTA.setHostname().
; Supply it with --upload-port so it never becomes a checked-in setting.
upload_protocol = espota
extra_scripts = pre:tools/ota_auth.py

[env:waveshare_esp32s3_nano_usb]
extends = env:waveshare_esp32s3_nano_common
upload_protocol = esptool
