; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tenstar_esp32s3_zero

[env:tenstar_esp32s3_zero]
platform = espressif32
board = tenstar_esp32s3_zero
framework = arduino
monitor_speed = 115200

lib_deps =
  chris--a/Keypad@^3.1.1
  olikraus/U8g2@^2.35.30
  throwtheswitch/Unity@^2.6.1
build_flags = -std=gnu++17
board_build.partitions = partitions.csv

; Default upload path: connect the device over USB.
upload_protocol = esptool

; OTA upload path:
;   pio run -e tenstar_esp32s3_zero_ota -t upload
; The hostname must match DEVICE_ID / ArduinoOTA.setHostname().
[env:tenstar_esp32s3_zero_ota]
extends = env:tenstar_esp32s3_zero
upload_protocol = espota
upload_port = HIMS-SCAN-R1.local
extra_scripts = pre:tools/ota_auth.py
