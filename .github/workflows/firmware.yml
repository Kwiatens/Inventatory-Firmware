name: Firmware CI

on:
  push:
    paths:
      - '.github/workflows/firmware.yml'
      - 'boards/**'
      - 'examples/**'
      - 'include/**'
      - 'partitions.csv'
      - 'platformio.ini'
      - 'src/**'
      - 'host-tests/**'
      - 'test/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/firmware.yml'
      - 'boards/**'
      - 'examples/**'
      - 'include/**'
      - 'partitions.csv'
      - 'platformio.ini'
      - 'src/**'
      - 'host-tests/**'
      - 'test/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      run_hardware_tests:
        description: Run the embedded Unity tests on the attached Scan R1 board
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build firmware and compile Unity image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Bootstrap non-secret build configuration
        run: cp src/config/config.example.h src/config/config.h

      - name: Reject scanner payload diagnostics
        run: |
          # git grep exits 0 on a match, 1 when nothing matches, and >1 on error.
          # Only exit 1 passes; a match or a git error fails the step.
          reject_pattern() {
            local pattern="$1"
            local status=0
            git grep -n -E -e "$pattern" -- src || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::Forbidden pattern matched in src: $pattern"
              exit 1
            elif [ "$status" -gt 1 ]; then
              echo "::error::git grep failed with exit $status for pattern: $pattern"
              exit "$status"
            fi
          }
          reject_pattern 'GM65 rx|GM65 scan:'
          reject_pattern 'sendDebugMessage\(.*(scannedCode_|trimmed|forwardedCode|manufacturerPartNumber)'
          reject_pattern '(Serial\.(print|println|printf)|sendDebugMessage)\(.*(scannedCode_|forwardedCode|wifiPassword|deviceToken|clientConfig_\.token|settings\.deviceToken)'

          # A logging call can be split over several lines. Match up to its ';' across
          # newlines: git grep -z reads each file as one record.
          reject_multiline_pattern() {
            local pattern="$1"
            local status=0
            git grep -z -q -P -e "$pattern" -- src || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::Forbidden multi-line pattern matched in src: $pattern"
              exit 1
            elif [ "$status" -gt 1 ]; then
              echo "::error::git grep failed with exit $status for pattern: $pattern"
              exit "$status"
            fi
          }
          reject_multiline_pattern '(Serial\.(print|println|printf)|sendDebugMessage)\([^;]*(scannedCode_|forwardedCode|wifiPassword|deviceToken|clientConfig_\.token|settings\.deviceToken)'
          reject_multiline_pattern 'sendDebugMessage\([^;]*(scannedCode_|trimmed|forwardedCode|manufacturerPartNumber)'

      - name: Build USB firmware
        run: pio run -e waveshare_esp32s3_nano_usb

      - name: Build OTA firmware without uploading
        run: |
          # The OTA build rejects the example placeholder; use a throwaway value.
          sed -i "s/paste-your-ota-password-here/ci-only-$(openssl rand -hex 8)/" src/config/config.h
          pio run -e waveshare_esp32s3_nano_ota

      - name: Compile embedded Unity image (assertions not run)
        run: pio test -e waveshare_esp32s3_nano_usb --without-uploading --without-testing

      - name: Build display smoke-test example
        working-directory: examples/gmg12864_spi_test
        run: pio run -e waveshare_esp32s3_nano

  host-tests:
    name: Run the Unity suite on the host with sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build and run the suite with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -C host-tests SANITIZE=address,undefined test

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Run the host suite with Clang
        run: |
          make -C host-tests clean
          make -C host-tests CXX=clang++ CC=clang test

      - name: Report host line coverage
        run: make -C host-tests coverage

  hardware-tests:
    name: Run embedded Unity assertions on hardware
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hardware_tests }}
    runs-on: [self-hosted, windows, inventatory-scan-r1]
    timeout-minutes: 20
    concurrency:
      group: scan-r1-hardware
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Bootstrap non-secret build configuration
        shell: pwsh
        run: Copy-Item src/config/config.example.h src/config/config.h

      - name: Upload image and run Unity assertions
        run: pio test -e waveshare_esp32s3_nano_usb
