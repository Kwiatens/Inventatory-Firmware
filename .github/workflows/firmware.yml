name: Firmware CI

on:
  push:
    paths:
      - '.github/workflows/firmware.yml'
      - 'boards/**'
      - 'examples/**'
      - 'include/**'
      - 'partitions.csv'
      - 'platformio.ini'
      - 'src/**'
      - 'host-tests/**'
      - 'test/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/firmware.yml'
      - 'boards/**'
      - 'examples/**'
      - 'include/**'
      - 'partitions.csv'
      - 'platformio.ini'
      - 'src/**'
      - 'host-tests/**'
      - 'test/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

# Every job runs on a GitHub-hosted runner. A self-hosted runner on a public repository runs whatever
# workflow a pull request brings, so the hardware tests run on the bench PC by hand (docs/testing.md).

jobs:
  build:
    name: Build firmware and compile Unity image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Bootstrap non-secret build configuration
        run: cp src/config/config.example.h src/config/config.h

      - name: Reject sensitive logging
        # Reads each source file whole, so a logging call split over several lines is checked too.
        run: python3 tools/check_logging.py

      - name: Build USB firmware
        run: pio run -e waveshare_esp32s3_nano_usb

      - name: Record the image hash
        # The owner signs releases on their own PC (docs/ota-protocol.md) and checks this hash first.
        run: sha256sum .pio/build/waveshare_esp32s3_nano_usb/firmware.bin | tee firmware.bin.sha256

      - name: Publish the unsigned image for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/waveshare_esp32s3_nano_usb/firmware.bin
            firmware.bin.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Compile embedded Unity image (assertions not run)
        run: pio test -e waveshare_esp32s3_nano_usb --without-uploading --without-testing

      - name: Build display smoke-test example
        working-directory: examples/gmg12864_spi_test
        run: pio run -e waveshare_esp32s3_nano

  host-tests:
    name: Run the Unity suite on the host with sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the error-code catalogue
        run: python3 tools/check_error_codes.py

      - name: Test the signing and test-server tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Install OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build and run the suite with AddressSanitizer and UndefinedBehaviorSanitizer
        run: make -C host-tests SANITIZE=address,undefined test

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Run the host suite with Clang
        run: |
          make -C host-tests clean
          make -C host-tests CXX=clang++ CC=clang test

      - name: Report host line coverage
        run: make -C host-tests coverage
