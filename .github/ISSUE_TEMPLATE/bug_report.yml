name: Bug Report
description: Create a report to help us improve the firmware
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please review the `SECURITY.md` file if this is a security vulnerability.
  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version or Commit
      description: What version or commit of the firmware are you running?
    validations:
      required: true
  - type: input
    id: hardware_revision
    attributes:
      label: Board / Hardware Revision
      description: Are you using the Waveshare ESP32-S3-Nano? Any custom wiring?
    validations:
      required: true
  - type: input
    id: build_env
    attributes:
      label: Build Environment
      description: Are you building with PlatformIO? Which OS?
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug in detail.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: textarea
    id: serial_log
    attributes:
      label: Serial Log
      description: "Provide relevant serial logs. WARNING - remove Wi-Fi names, tokens, passwords, and scanned codes before posting."
    validations:
      required: false
